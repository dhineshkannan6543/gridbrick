version: '3.8'

services:
  aerocast-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerocast-uk:latest
    container_name: aerocast_uk_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
